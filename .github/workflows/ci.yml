name: CI

# Local runner only, trusted pushes only (no pull_request trigger: this repo is
# public, so PR code must never reach the persistent runner).
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: [self-hosted, Linux, X64, jan-lxc]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: python -m py_compile app.py
      - name: Unit tests
        run: python -m unittest discover -s tests -v
