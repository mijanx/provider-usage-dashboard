name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: [self-hosted, Linux, X64, net-github-runner]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax check
        run: python -m py_compile app.py
      - name: Unit tests
        run: python -m unittest discover -s tests -v
